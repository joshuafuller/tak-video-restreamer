<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TAK Video Restreamer</title>
    <!-- Shared UMT visual language (vendored; see umt-shared.README.md).
         Must load before styles.css, which layers this app on top of it. -->
    <link rel="stylesheet" href="/static/umt-shared.css">
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--primary-bg);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            padding: 2.5rem;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-color);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header img {
            width: 128px;
            height: 128px;
            margin-bottom: 0.75rem;
        }
        .login-header h1 {
            font-size: 1.3rem;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }
        .login-header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .login-form .form-group {
            margin-bottom: 1.25rem;
        }
        .login-form label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
        }
        .login-form input[type="text"],
        .login-form input[type="password"] {
            width: 100%;
            padding: 0.65rem 0.85rem;
            background: var(--surface-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .login-form input:focus {
            border-color: var(--accent-primary);
        }
        .login-btn {
            width: 100%;
            padding: 0.7rem;
            background: var(--accent-primary);
            color: var(--text-primary);
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-btn:hover {
            background: var(--accent-dark);
        }
        .error-msg {
            background: var(--tint-danger);
            border: 1px solid var(--accent-danger);
            color: var(--accent-danger);
            padding: 0.6rem 0.85rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
        .warning-banner {
            background: var(--tint-warn);
            border: 1px solid var(--accent-warning);
            color: var(--accent-warning);
            padding: 0.6rem 0.85rem;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            margin-bottom: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <img src="/static/tak_video_restreamer_logo.png" alt="Logo" onerror="this.style.display='none'">
            <h1>TAK Video Restreamer</h1>
            <p>Sign in to continue</p>
        </div>

        <div id="default-pw-warning" class="warning-banner" style="display: none;">
            ⚠️ Default password in use. Set <code style="background: rgba(8, 15, 23, 0.35); padding: 0.1rem 0.3rem; border-radius: 3px;">ADMIN_PASSWORD</code> in docker-compose.yml and restart the container.
        </div>

        <div id="error-msg" class="error-msg"></div>

        <form class="login-form" id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="login-btn">Sign In</button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('error-msg');
            errEl.style.display = 'none';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    window.location.href = data.redirect || '/';
                } else {
                    errEl.textContent = data.error || 'Invalid credentials';
                    errEl.style.display = 'block';
                }
            } catch (err) {
                errEl.textContent = 'Connection error';
                errEl.style.display = 'block';
            }
        });

        // Check if default password
        fetch('/api/auth/status').then(r => r.json()).then(data => {
            if (data.default_password) {
                document.getElementById('default-pw-warning').style.display = 'block';
            }
        }).catch(() => {});
    </script>
</body>
</html>
