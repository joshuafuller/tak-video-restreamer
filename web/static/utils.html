<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utils - Video Transcoding</title>
    <!-- Shared UMT visual language (vendored; see umt-shared.README.md).
         Must load before styles.css, which layers this app on top of it. -->
    <link rel="stylesheet" href="/static/umt-shared.css">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <!-- ═══ APP CHROME — REMOVE WHEN THIS BECOMES A UMT MODULE ═══
             UMT sub-apps render in an iframe under the shell's ribbon, which
             supplies the branding and the nav. This masthead is what makes the
             app standalone; under the shell it would be dropped and <main>
             promoted. Matching marker in styles.css. -->
        <header>
            <div class="header-content">
                <div class="header-title">
                    <a href="/" class="header-brand">
                        <img src="/static/tak_video_restreamer_logo.png" alt="TAK Video Restreamer Logo" class="header-logo">
                        <div>
                            <h1>TAK Video Restreamer</h1>
                        </div>
                    </a>
                </div>
                <nav class="header-nav">
                    <a href="/" class="nav-link">
                        Dashboard
                    </a>
                    <a href="/recordings" class="nav-link">
                        Recordings
                    </a>
                    <a href="/utils" class="nav-link active">
                        Utils
                    </a>
                    <a href="/test" class="nav-link">
                        Test Video
                    </a>
                    <a href="/videowall" class="nav-link">
                        Video Wall
                    </a>
                    <a href="/settings" class="nav-link">
                        Settings
                    </a>
                    <a href="#" class="nav-link" id="logout-link" style="color: var(--accent-danger);">Logout</a>
                </nav>
            </div>
        </header>

        <main class="main-layout">
            <section class="card">
                <h2>Video Utilities</h2>
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
                    Transcode recordings with timecode correction and optional STANAG 4609 KLV sidecar files
                </p>

                <div class="tab-buttons">
                    <button class="tab-button active" onclick="switchTab('transcode', this)">
                        Transcode Video
                    </button>
                    <button class="tab-button" onclick="switchTab('jobs', this)">
                        Jobs
                    </button>
                </div>

                <!-- Transcode Tab -->
                <div id="transcode-tab" class="tab-content active">
                    <div class="utils-grid">
                        <div>
                            <div class="form-group">
                                <label>Select Recording</label>
                                <div id="recordings-list" class="recordings-list">
                                    <div class="empty-state">Loading recordings...</div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Or Enter File Path</label>
                                <input type="text" id="input-file" placeholder="drone1/recording.mov">
                            </div>
                        </div>

                        <div>
                            <div class="form-group">
                                <label>Transcode Option</label>
                                <!-- Populated from GET /api/transcode/options so the values
                                     can never drift out of sync with the backend. -->
                                <select id="transcode-option">
                                    <option value="">Loading options...</option>
                                </select>
                                <div id="option-info" class="option-info"></div>
                            </div>
                            
                            <button id="start-transcode-btn" class="btn btn-primary" style="width: 100%;">
                                Start Transcode
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Jobs Tab -->
                <div id="jobs-tab" class="tab-content">
                    <div id="active-jobs-list">
                        <div class="empty-state">No active or recent jobs</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Socket.IO with graceful degradation
        let socket = null;
        
        // Try to initialize Socket.IO if available
        if (typeof io !== 'undefined') {
            socket = io();
            
            // Connect to server
            socket.on('connect', () => {
                loadRecordings();
                loadTranscodeStatus();
                loadTranscodeOptions();
            });

            socket.on('disconnect', () => {
                console.log('Socket disconnected');
            });

            // Listen for transcode completion
            socket.on('message', (msg) => {
                if (msg.type === 'transcode_complete') {
                    loadTranscodeStatus();
                    showNotification(
                        msg.data.success ? 'Transcode completed!' : 'Transcode failed',
                        msg.data.success ? 'success' : 'error'
                    );
                }
            });
        } else {
            // Socket.IO not available, using polling mode
            // Load data immediately without Socket.IO
            loadRecordings();
            loadTranscodeStatus();
            loadTranscodeOptions();
        }

        let recordings = [];
        let transcodeJobs = {};

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value == null ? '' : String(value);
            return div.innerHTML;
        }

        // Tab switching
        function switchTab(tab, element) {
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (element) {
                element.classList.add('active');
            }
            document.getElementById(`${tab}-tab`).classList.add('active');
            
            if (tab === 'jobs') {
                loadTranscodeStatus();
            }
        }

        // Load recordings
        async function loadRecordings() {
            try {
                const response = await fetch('/api/recordings');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                recordings = await response.json();
                
                renderRecordingsList('recordings-list', false);
            } catch (error) {
                console.error('Error loading recordings:', error);

                // Show error in UI
                const container = document.getElementById('recordings-list');
                if (container) {
                    container.innerHTML = `<div class="empty-state" style="color: var(--danger);">Error loading recordings: ${error.message}</div>`;
                }
            }
        }

        function renderRecordingsList(elementId, mediaOnly) {
            const container = document.getElementById(elementId);
            
            if (!container) {
                console.error(`Container ${elementId} not found`);
                return;
            }
            
            if (recordings.length === 0) {
                container.innerHTML = '<div class="empty-state">No recordings found</div>';
                return;
            }
            
            let filteredRecordings = recordings;
            if (mediaOnly) {
                filteredRecordings = recordings.filter(r => {
                    const filename = r.filename.toLowerCase();
                    return filename.endsWith('.ts') || 
                           filename.endsWith('.mov') ||
                           filename.endsWith('.mp4') ||
                           filename.endsWith('.mkv') ||
                           filename.endsWith('.mxf') ||
                           filename.endsWith('.mpg') ||
                           filename.endsWith('.mpeg');
                });
            }
            
            if (filteredRecordings.length === 0) {
                container.innerHTML = '<div class="empty-state">No compatible recordings found</div>';
                return;
            }
            
            container.innerHTML = filteredRecordings.map(rec => {
                const escapedStream = rec.stream.replace(/'/g, "\\'");
                const escapedFilename = rec.filename.replace(/'/g, "\\'");
                return `
                    <div class="recording-item" data-stream="${escapedStream}" data-filename="${escapedFilename}" data-list="${elementId}">
                        <div class="recording-name">${rec.filename}</div>
                        <div class="recording-meta">
                            Stream: ${rec.stream} | 
                            Size: ${formatFileSize(rec.size)} |
                            Created: ${new Date(rec.created).toLocaleString()}
                        </div>
                    </div>
                `;
            }).join('');
            
            // Add click listeners after rendering
            container.querySelectorAll('.recording-item').forEach(item => {
                item.addEventListener('click', () => {
                    const stream = item.getAttribute('data-stream');
                    const filename = item.getAttribute('data-filename');
                    const listId = item.getAttribute('data-list');
                    selectRecording(stream, filename, listId);
                });
            });
        }

        function selectRecording(stream, filename, listId) {
            const path = `${stream}/${filename}`;
            
            // Remove previous selection highlights
            document.querySelectorAll(`#${listId} .recording-item`).forEach(item => {
                item.classList.remove('selected');
            });
            
            // Highlight selected item
            const selectedItem = document.querySelector(`#${listId} [data-stream="${stream}"][data-filename="${filename}"]`);
            if (selectedItem) {
                selectedItem.classList.add('selected');
            }
            
            document.getElementById('input-file').value = path;

            console.log('Selected recording:', path);
        }

        // Transcode options, loaded from the backend so the option numbers the UI
        // submits always match the ones the server dispatches on.
        let transcodeOptions = [];

        function renderOptionInfo() {
            const infoDiv = document.getElementById('option-info');
            const value = parseInt(document.getElementById('transcode-option').value);
            const opt = transcodeOptions.find(o => o.option === value);

            if (!opt) {
                infoDiv.innerHTML = '';
                infoDiv.className = 'option-info';
                return;
            }

            const klvNote = opt.klvFormat === 'separate_file'
                ? '<br>• KLV written to a separate .klv.bin file, not embedded'
                : (opt.klv ? '' : '<br>• No KLV metadata');

            infoDiv.innerHTML = `<strong>${escapeHtml(opt.name)}</strong><br>${escapeHtml(opt.description)}`
                + `<br>• Output format: ${escapeHtml((opt.format || '').toUpperCase())}${klvNote}`;
            infoDiv.className = opt.recommended ? 'option-info recommended' : 'option-info';
        }

        async function loadTranscodeOptions() {
            const select = document.getElementById('transcode-option');
            try {
                const response = await fetch('/api/transcode/options');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                transcodeOptions = data.options || [];

                select.innerHTML = '';
                transcodeOptions.forEach(opt => {
                    const el = document.createElement('option');
                    el.value = opt.option;
                    el.textContent = `Option ${opt.option}: ${opt.name}`;
                    if (opt.option === data.default) el.selected = true;
                    select.appendChild(el);
                });

                renderOptionInfo();
            } catch (error) {
                console.error('Error loading transcode options:', error);
                select.innerHTML = '<option value="">Failed to load options</option>';
                showNotification('Could not load transcode options', 'error');
            }
        }

        document.getElementById('transcode-option')?.addEventListener('change', renderOptionInfo);

        // Start transcode
        document.getElementById('start-transcode-btn')?.addEventListener('click', async () => {
            const inputFile = document.getElementById('input-file').value.trim();
            const option = parseInt(document.getElementById('transcode-option').value);
            
            if (!inputFile) {
                showNotification('Please select or enter an input file', 'error');
                return;
            }
            
            const btn = document.getElementById('start-transcode-btn');
            btn.disabled = true;
            btn.textContent = 'Starting...';
            
            try {
                const response = await fetch('/api/transcode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ inputFile, option })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showNotification('Transcode started successfully!', 'success');
                    // Switch to jobs tab and activate the button
                    const jobsBtn = document.querySelector('.tab-button[onclick*="jobs"]');
                    switchTab('jobs', jobsBtn);
                    setTimeout(() => loadTranscodeStatus(), 1000);
                    
                    // Poll for updates if no socket
                    if (!socket) {
                        pollTranscodeStatus(result.transcodeId);
                    }
                } else {
                    const errorMsg = result.error || 'Unknown error';
                    console.error('Transcode error:', errorMsg);
                    showNotification('Failed to start transcode. Check console for details.', 'error');
                }
            } catch (error) {
                console.error('Error starting transcode:', error);
                showNotification('Error starting transcode', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Start Transcode';
            }
        });

        // Load transcode status
        async function loadTranscodeStatus() {
            try {
                const response = await fetch('/api/transcode/status');
                const status = await response.json();
                
                const container = document.getElementById('active-jobs-list');
                const allJobs = [...status.active, ...status.completed, ...status.failed];
                
                if (allJobs.length === 0) {
                    container.innerHTML = '<div class="empty-state">No active or recent jobs</div>';
                    return;
                }
                
                container.innerHTML = allJobs.map(job => renderJobCard(job)).join('');
                
                // Auto-refresh if there are active jobs
                if (status.active.length > 0) {
                    setTimeout(loadTranscodeStatus, 3000);
                }
            } catch (error) {
                console.error('Error loading transcode status:', error);
            }
        }

        function renderJobCard(job) {
            const elapsed = Math.floor(job.elapsed || 0);
            const progress = job.progress || 0;
            const isActive = job.status === 'running' || job.status === 'starting';
            
            return `
                <div class="job-card">
                    <div class="job-header">
                        <div class="job-title">${job.inputFile}</div>
                        <div class="job-status ${job.status}">${job.status.toUpperCase()}</div>
                    </div>
                    
                    ${isActive ? `
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%"></div>
                        </div>
                    ` : ''}
                    
                    ${job.status === 'completed' ? `
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 100%; background: var(--good);"></div>
                        </div>
                    ` : ''}
                    
                    <div class="job-details">
                        <div class="job-detail">
                            <span class="job-detail-label">Option:</span>
                            <span class="job-detail-value">Option ${job.option}</span>
                        </div>
                        <div class="job-detail">
                            <span class="job-detail-label">${job.status === 'completed' || job.status === 'failed' ? 'Duration:' : 'Elapsed:'}</span>
                            <span class="job-detail-value">${formatDuration(elapsed)}</span>
                        </div>
                        ${job.status === 'running' && progress > 0 ? `
                            <div class="job-detail">
                                <span class="job-detail-label">Progress:</span>
                                <span class="job-detail-value">${progress}%</span>
                            </div>
                        ` : ''}
                        ${job.outputSize ? `
                            <div class="job-detail">
                                <span class="job-detail-label">Output Size:</span>
                                <span class="job-detail-value">${formatFileSize(job.outputSize)}</span>
                            </div>
                        ` : ''}
                    </div>
                    
                    ${job.outputFile ? `
                        <div class="output-file">
                            ✓ Output: ${job.outputFile}
                        </div>
                    ` : ''}
                    
                    ${job.error ? `
                        <div class="error-message">
                            ✗ Error: ${job.error}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // Helper functions
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
        }

        function formatDuration(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
        
        function pollTranscodeStatus(transcodeId) {
            const interval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/transcode/${transcodeId}/status`);
                    const job = await response.json();
                    
                    if (job.status === 'completed' || job.status === 'failed') {
                        clearInterval(interval);
                        loadTranscodeStatus();
                        showNotification(
                            job.status === 'completed' ? 'Transcode completed!' : 'Transcode failed',
                            job.status === 'completed' ? 'success' : 'error'
                        );
                    } else {
                        // Refresh the jobs tab if it's active
                        if (document.getElementById('jobs-tab').classList.contains('active')) {
                            loadTranscodeStatus();
                        }
                    }
                } catch (error) {
                    console.error('Error polling transcode status:', error);
                }
            }, 3000); // Poll every 3 seconds
        }

        function showNotification(message, type = 'info') {
            try {
                // Create toast notification (similar to client.js)
                const notification = document.createElement('div');
                const safeType = (type && typeof type === 'string') ? type : 'info';
                const safeMessage = (message && typeof message === 'string') ? message : 'Unknown error';
                
                notification.className = `notification notification-${safeType}`;
                notification.textContent = safeMessage;
            
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    padding: 15px 20px;
                    border-radius: 8px;
                    color: white;
                    font-weight: 600;
                    z-index: 10000;
                    max-width: 400px;
                    opacity: 0;
                    transform: translateX(100%);
                    transition: all 0.3s ease;
                    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                `;
                
                switch (type) {
                    case 'success':
                        notification.style.backgroundColor = '#10b981';
                        break;
                    case 'error':
                        notification.style.backgroundColor = '#ef4444';
                        break;
                    case 'warning':
                        notification.style.backgroundColor = '#f59e0b';
                        break;
                    default:
                        notification.style.backgroundColor = '#3b82f6';
                }
                
                document.body.appendChild(notification);
                
                // Animate in
                setTimeout(() => {
                    notification.style.opacity = '1';
                    notification.style.transform = 'translateX(0)';
                }, 100);
                
                // Remove after 5 seconds
                setTimeout(() => {
                    notification.style.opacity = '0';
                    notification.style.transform = 'translateX(100%)';
                    setTimeout(() => {
                        if (notification.parentNode) {
                            notification.parentNode.removeChild(notification);
                        }
                    }, 300);
                }, 5000);
            } catch (notificationError) {
                console.error('Error showing notification:', notificationError);
            }
        }

        // Initial load
        loadRecordings();
        loadTranscodeOptions();

        // Logout
        document.getElementById('logout-link').addEventListener('click', (e) => {
            e.preventDefault();
            fetch('/api/auth/logout', { method: 'POST' }).finally(() => { window.location.href = '/login'; });
        });

        // Default password warning
        fetch('/api/auth/status').then(r => r.json()).then(data => {
            if (data.default_credentials) {
                const banner = document.createElement('div');
                banner.innerHTML = '&#9888; <strong>Security Warning:</strong> Default password in use. Change via ADMIN_PASSWORD env var.';
                Object.assign(banner.style, {
                    position: 'fixed', top: '0', left: '0', right: '0',
                    padding: '0.75rem 1rem', background: '#f59e0b', color: '#000',
                    textAlign: 'center', zIndex: '9999', fontWeight: '500', fontSize: '0.9em'
                });
                document.body.prepend(banner);
                document.body.style.paddingTop = '3rem';
            }
        }).catch(() => {});
    </script>
</body>
</html>
